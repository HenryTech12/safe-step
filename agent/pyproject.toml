[project]
name = "safestep-agent"
version = "0.1.0"
description = "SafeStep voice agent (LiveKit) and token server"
requires-python = ">=3.11,<3.14"
dependencies = [
    "livekit-agents[google,spitch,silero]~=1.8",
    "livekit-plugins-noise-cancellation~=0.3",
    "livekit-api~=1.2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["safestep_agent*", "token_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
